name: Build threads.exe
description: Build threads.exe
inputs:
  version:
    description: Version to use
    required: false
  platform:
    description: Target platform
    required: true
runs:
  using: composite
  steps:
    - env:
        ARG_VERSION: ${{ inputs.version }}
        ARG_PLATFORM: ${{ inputs.platform }}
      run: |
        $version = $env:ARG_VERSION
        $version = if ($version) { "-$version" } else { $version }

        $flags = @()
        if ($env:ARG_PLATFORM -eq 'x86') {
            $flags += '-m32'
        }
        $flags += '-std=c++11','-o','test/threads','test/threads.cpp'
        if ('${{ runner.os }}' -eq 'Linux') {
            $flags += '-lpthread'
        }

        & "g++$version" $flags
      shell: pwsh
